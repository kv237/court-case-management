<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>
      Court Case Management System
    </title>

    <!-- THEME FLASH PREVENTION -->

    <script>
      (() => {
        const savedTheme =
          localStorage.getItem(
            "court-theme"
          );

        const prefersDark =
          window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;

        const theme =
          savedTheme ||
          (prefersDark
            ? "dark"
            : "light");

        if (theme === "dark") {
          document.documentElement.classList.add(
            "dark"
          );
        } else {
          document.documentElement.classList.remove(
            "dark"
          );
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
